server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: view-gene-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/view_gene?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:)Tki8gj*2;<q}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-before-use}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  simulation:
    material-check-delay-ms: ${SIMULATION_MATERIAL_CHECK_DELAY_MS:1000}
    generating-delay-ms: ${SIMULATION_GENERATING_DELAY_MS:3000}
    finalizing-delay-ms: ${SIMULATION_FINALIZING_DELAY_MS:1000}
    failure-stage: ${SIMULATION_FAILURE_STAGE:NONE}
