services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: view_gene
      MYSQL_USER: view_gene
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:-view-gene-password}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_ROOT_PASSWORD:-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/view_gene?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: view_gene
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:-view-gene-password}
      JWT_SECRET: ${COMPOSE_JWT_SECRET:-compose-development-secret-at-least-32-characters}
      UPLOAD_DIR: /app/uploads
      SIMULATION_MATERIAL_CHECK_DELAY_MS: ${SIMULATION_MATERIAL_CHECK_DELAY_MS:-1000}
      SIMULATION_GENERATING_DELAY_MS: ${SIMULATION_GENERATING_DELAY_MS:-3000}
      SIMULATION_FINALIZING_DELAY_MS: ${SIMULATION_FINALIZING_DELAY_MS:-1000}
      SIMULATION_FAILURE_STAGE: ${SIMULATION_FAILURE_STAGE:-NONE}
    volumes:
      - uploaded-assets:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  uploaded-assets:
